[package]
name = "dprint-plugin-oxc"
version = "0.44.0"
authors = ["David Sherret <dsherret@gmail.com>"]
edition = "2024"
homepage = "https://github.com/dprint/dprint-plugin-oxc"
keywords = ["formatting", "formatter", "oxc"]
license = "MIT"
repository = "https://github.com/dprint/dprint-plugin-oxc"
description = "JavaScript, TypeScript, JSON, CSS, GraphQL, YAML, Markdown, and TOML formatter for dprint via Oxc."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]

[dependencies]
dprint-core = { version = "0.70.0", default-features = false }
oxc-toml = "0.14.5"
oxc_allocator = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.153.0" }
oxc_diagnostics = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.153.0" }
oxc_formatter = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.153.0" }
oxc_formatter_core = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.153.0" }
oxc_formatter_css = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.153.0" }
oxc_formatter_graphql = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.153.0" }
oxc_formatter_json = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.153.0" }
oxc_formatter_markdown = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.153.0" }
oxc_formatter_yaml = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.153.0" }
oxc_span = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.153.0" }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
sort-package-json = "1.0.0"

[dev-dependencies]
dprint-development = "0.12.1"
pretty_assertions = "1.4.0"
serde_json = { version = "1.0" }

# The parsers of the non-JS formatters (ex. `oxc-css-parser`) are published to crates.io
# and so depend on the `oxc_allocator` that's in the registry, which cargo considers to be
# a different crate than the one from git. Resolve it to the one from git so there's only one.
[patch.crates-io]
oxc_allocator = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.153.0" }

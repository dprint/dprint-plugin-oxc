name: CI

on: [push, pull_request]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: full

    steps:
    - uses: actions/checkout@v6
    - uses: dsherret/rust-toolchain-file@v1
    - name: Install wasm32 target
      run: rustup target add wasm32-unknown-unknown

    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}

    # deno is needed by the "Generate config schema" step and, on a tag, by the
    # "Pre-release" step
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Build release
      run: cargo build --target wasm32-unknown-unknown --features wasm --release

    # adds the outputs of the code examples to the config schema, which also
    # checks that the plugin accepts every property in it
    - name: Generate config schema
      run: deno run -A --minimum-dependency-age=0 jsr:@dprint/automation@0.14.3/tasks/publish-schema target/wasm32-unknown-unknown/release/dprint_plugin_oxc.wasm deployment/schema.json --extension ts

    - name: Test
      run: cargo test

    - name: Get tag version
      if: startsWith(github.ref, 'refs/tags/')
      id: get_tag_version
      run: echo ::set-output name=TAG_VERSION::${GITHUB_REF/refs\/tags\//}

    # NPM
    - uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        registry-url: 'https://registry.npmjs.org'

    - name: Setup and test npm deployment
      run: |
        cd deployment/npm
        npm install
        node setup.js
        npm run test

      # GITHUB RELEASE
    - name: Pre-release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # update config schema to have version
        sed -i 's/oxc\/0.0.0/oxc\/${{ steps.get_tag_version.outputs.TAG_VERSION }}/' deployment/schema.json
        # rename the wasm file
        (cd target/wasm32-unknown-unknown/release/ && mv dprint_plugin_oxc.wasm plugin.wasm)
        # create release notes
        deno run -A ./scripts/generateReleaseNotes.ts ${{ steps.get_tag_version.outputs.TAG_VERSION }} > ${{ github.workspace }}-CHANGELOG.txt
    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      # gh uploads the assets to a draft and then publishes it, which immutable releases require
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
          --notes-file ${{ github.workspace }}-CHANGELOG.txt \
          target/wasm32-unknown-unknown/release/plugin.wasm \
          deployment/schema.json
